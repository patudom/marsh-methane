name: Single Branch Build and Deploy

on:
  push:
    branches:
      - '**'
      - '!gh-pages'

permissions:
  contents: write

concurrency:
  # Per-branch, since each branch deploys to its own subdirectory — several can
  # run at once without clobbering each other.
  group: build-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.repository_owner == 'patudom' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Use Yarn 4
        run: |
          corepack enable
          yarn set version 4.12.0

      - name: Yarn install
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Check for draft flag
        uses: sergeysova/jq-action@v2
        id: draft
        with:
          cmd: cat package.json | jq -r '.draft // false'

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        if: ${{ steps.draft.outputs.value == 'false' }}
        with:
          branch: gh-pages
          folder: dist
          clean: true
